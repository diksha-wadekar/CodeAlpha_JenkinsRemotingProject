version: "3.8"

# CodeAlpha DevOps Internship - Task 2: Jenkins Remoting Project
#
# Spins up a Jenkins controller plus a separate SSH-based agent container,
# simulating a "remote" build node connected via Jenkins Remoting (JNLP/SSH).
#
# Usage:
#   docker compose up -d
#   Open http://localhost:8080 and follow README.md to connect the agent.

services:
  jenkins-controller:
    image: jenkins/jenkins:lts-jdk17
    container_name: jenkins-controller
    ports:
      - "8080:8080"   # Web UI
      - "50000:50000" # Agent (JNLP) communication port
    volumes:
      - jenkins_home:/var/jenkins_home
    networks:
      - jenkins-net
    restart: unless-stopped

  jenkins-agent:
    image: jenkins/ssh-agent:latest-jdk17
    container_name: jenkins-agent
    hostname: remote-node-1
    environment:
      # Public key of the SSH keypair Jenkins will use to log into this agent.
      # Generate a keypair and paste the PUBLIC key value here (see README).
      - JENKINS_AGENT_SSH_PUBKEY=REPLACE_WITH_YOUR_PUBLIC_KEY
    networks:
      - jenkins-net
    restart: unless-stopped

networks:
  jenkins-net:
    driver: bridge

volumes:
  jenkins_home:
